name: Chrome AI build hook
description: Run the Java Smart Builder before or after Maven using the existing ChromeLLM provider.
inputs:
  phase:
    description: pre-build or post-build
    required: true
  project-directory:
    description: Maven project directory
    default: '.'
  build-directory:
    description: Report directory below the project; keep outside target when running clean
    default: '.github-build'
  build-outcome:
    description: Observed Maven success or failure; required for post-build
    default: ''
  log-file:
    description: Explicit Maven log file for post-build
    default: ''
  source-root:
    description: Optional bounded source directory inside the project
    default: ''
  atom-pattern-manifest:
    description: Project-local manifest binding canonical Java atomization and patternization checkpoints
    default: ''
  require-atom-pattern:
    description: Require complete current Java checkpoint coverage before inference
    default: 'false'
  backend:
    description: chrome for real inference, none for deterministic facts only
    default: chrome
  chrome-llm-jar:
    description: Independently built ChromeLLM standalone module JAR
    default: ''
  chrome-path:
    description: Installed Chrome executable; defaults to google-chrome on PATH
    default: ''
  chrome-profile:
    description: Dedicated persistent profile; use the same path for both hooks
    default: ''
  headless:
    description: Hide Chrome windows
    default: 'true'
  allow-download:
    description: Explicitly allow Chrome to download its model lazily
    default: 'false'
  timeout-seconds:
    description: End-to-end inference deadline, 1 to 600 seconds
    default: '120'
outputs:
  report:
    description: Absolute path to the JSON report
    value: ${{ steps.hook.outputs.report }}
  hook-status:
    description: Hook exit status, independent of the observed Maven outcome
    value: ${{ steps.hook.outputs.hook-status }}
runs:
  using: composite
  steps:
    - name: Invoke Java Chrome AI hook
      id: hook
      shell: bash
      env:
        HOOK_ACTION_PATH: ${{ github.action_path }}
        HOOK_PHASE: ${{ inputs.phase }}
        HOOK_PROJECT: ${{ inputs.project-directory }}
        HOOK_BUILD_DIR: ${{ inputs.build-directory }}
        HOOK_BUILD_OUTCOME: ${{ inputs.build-outcome }}
        HOOK_LOG: ${{ inputs.log-file }}
        HOOK_SOURCE: ${{ inputs.source-root }}
        HOOK_ATOM_PATTERN_MANIFEST: ${{ inputs.atom-pattern-manifest }}
        HOOK_REQUIRE_ATOM_PATTERN: ${{ inputs.require-atom-pattern }}
        HOOK_BACKEND: ${{ inputs.backend }}
        HOOK_MODULE: ${{ inputs.chrome-llm-jar }}
        HOOK_CHROME: ${{ inputs.chrome-path }}
        HOOK_PROFILE: ${{ inputs.chrome-profile }}
        HOOK_HEADLESS: ${{ inputs.headless }}
        HOOK_DOWNLOAD: ${{ inputs.allow-download }}
        HOOK_TIMEOUT: ${{ inputs.timeout-seconds }}
      run: bash "$HOOK_ACTION_PATH/run.sh"
