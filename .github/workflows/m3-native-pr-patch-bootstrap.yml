name: M3 Native GitHub Patch Bootstrap
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'impl/maven-cli/src/main/java/org/apache/maven/cling/M3GitHubPatchBootstrap.java'
      - 'impl/maven-cli/src/main/java/org/apache/maven/cling/M3ChromeAiReviewPacket.java'
      - 'impl/maven-cli/src/main/java/org/apache/maven/cling/MavenCling.java'
      - 'impl/maven-cli/src/test/java/org/apache/maven/cling/M3GitHubPatchBootstrap*'
      - 'impl/maven-cli/src/test/java/org/apache/maven/cling/M3ChromeAiReviewPacket*'
      - 'm3/PATCH_RECIPE_BOOT.md'
      - '.github/workflows/m3-native-pr-patch-bootstrap.yml'
permissions:
  contents: read
jobs:
  native-source-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Strict native Maven bootstrap source and refusal assertions
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          javac --release 17 -Xlint:all -Werror -d "$work" \
            impl/maven-cli/src/main/java/org/apache/maven/cling/M3GitHubPatchBootstrap.java \
            impl/maven-cli/src/main/java/org/apache/maven/cling/M3ChromeAiReviewPacket.java \
            impl/maven-cli/src/test/java/org/apache/maven/cling/M3GitHubPatchBootstrapSelfTest.java \
            impl/maven-cli/src/test/java/org/apache/maven/cling/M3ChromeAiReviewPacketSelfTest.java
          java -cp "$work" org.apache.maven.cling.M3GitHubPatchBootstrapSelfTest
          java -cp "$work" org.apache.maven.cling.M3ChromeAiReviewPacketSelfTest
