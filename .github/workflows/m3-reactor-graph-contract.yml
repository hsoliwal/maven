# SPDX-License-Identifier: Apache-2.0
name: M3 Reactor Graph Classification Contract

on:
  pull_request:
    paths:
      - 'src/graph/**'
      - '.github/workflows/m3-reactor-graph-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run actual graphviz-java clustering self-test through JBang
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress \
            -f src/graph/contract/pom.xml verify \
            | tee "$RUNNER_TEMP/m3-reactor-graph-contract.log"
          grep -Fq 'PASS: original Maven, M3 providers, and future reactor nodes remain clustered' \
            "$RUNNER_TEMP/m3-reactor-graph-contract.log"
