# SPDX-License-Identifier: Apache-2.0
name: M3 project DB native Gradle evidence
on:
  pull_request:
    paths:
      - 'tools/project-db/**'
      - 'tools/m3-polyglot-maven-plugin/**'
      - '.github/workflows/m3-projectdb-gradle-evidence.yml'
  push:
    branches: [master]
    paths:
      - 'tools/project-db/**'
      - 'tools/m3-polyglot-maven-plugin/**'
      - '.github/workflows/m3-projectdb-gradle-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  project-db-native-gradle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: |
            tools/m3-polyglot-maven-plugin/pom.xml
            tools/project-db/pom.xml
      - name: Guard both project DB and M3IndexDB source-owner CI triggers
        run: sh tools/project-db/scripts/verify-crossfork-trigger.sh
      - name: Standalone Java 17 native Gradle JUnit parser admission
        run: sh tools/project-db/scripts/verify-gradle-sources.sh
      - name: Install original M3IndexDB-backed polyglot storage owner
        run: mvn -B -ntp -f tools/m3-polyglot-maven-plugin/pom.xml install
      - name: Run project-DB ingestion, retrieval, provenance and RAT contracts
        run: mvn -B -ntp -f tools/project-db/pom.xml verify
      - name: Seal source-built Maven JARs for matching Gradle TestKit job
        run: |
          set -eu
          mkdir -p qualified-maven-jars
          install -m 0644 tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar qualified-maven-jars/polyglot.jar
          install -m 0644 tools/project-db/target/maven-project-db-plugin-0.1.0-SNAPSHOT.jar qualified-maven-jars/project-db.jar
          printf 'M3-PROJECTDB-JARS-V1\\t%s\\t%s\\n' "$GITHUB_SHA" '${{ matrix.java }}' > qualified-maven-jars/SOURCE_RECEIPT.tsv
          (cd qualified-maven-jars && sha256sum polyglot.jar project-db.jar SOURCE_RECEIPT.tsv > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Publish qualified Maven JAR bytes and SHA-256 receipt
        uses: actions/upload-artifact@v4
        with:
          name: qualified-maven-jars-jdk-${{ matrix.java }}
          path: qualified-maven-jars/
          if-no-files-found: error
          retention-days: 7


  # The Gradle fork's Actions have no recent runs. Consume only JAR bytes
  # produced by the passing same-JDK Maven owner job; do not rebuild Maven
  # twice, copy Maven source into Gradle, or bypass storage qualification.
  gradle-consumer-real-testkit:
    needs: project-db-native-gradle
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Download the original JDK-specific Maven JARs from the passing owner job
        uses: actions/download-artifact@v4
        with:
          name: qualified-maven-jars-jdk-${{ matrix.java }}
          path: qualified-maven-jars
      - name: Verify original Maven JAR SHA-256 receipt before Gradle consumption
        run: |
          (cd qualified-maven-jars && sha256sum -c SHA256SUMS)
          expected_receipt=$(printf 'M3-PROJECTDB-JARS-V1\\t%s\\t%s' "$GITHUB_SHA" '${{ matrix.java }}')
          actual_receipt=$(cat qualified-maven-jars/SOURCE_RECEIPT.tsv)
          test "$actual_receipt" = "$expected_receipt" || { echo "wrong Maven source SHA or JDK lane" >&2; exit 1; }
          test -s qualified-maven-jars/polyglot.jar
          test -s qualified-maven-jars/project-db.jar
      - name: Check out exact reviewed Gradle project-DB consumer source
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/gradle
          ref: e8dbf558fcc8a83c580914fbcc4cb10fe4281eb6
          path: consumer-gradle
          persist-credentials: false
          sparse-checkout: |
            gradlew
            gradle/wrapper
            m3/quality-bridge
      - name: Execute real Gradle TestKit with source-built Maven project DB
        env:
          M3_POLYGLOT_JAR: ${{ github.workspace }}/qualified-maven-jars/polyglot.jar
          M3_PROJECT_DB_JAR: ${{ github.workspace }}/qualified-maven-jars/project-db.jar
        run: |
          test -s "$M3_POLYGLOT_JAR"
          test -s "$M3_PROJECT_DB_JAR"
          chmod +x consumer-gradle/gradlew
          cd consumer-gradle
          ./gradlew --no-daemon --stacktrace --console=plain \
            -p m3/quality-bridge test --tests '*M3ProjectDb*' --rerun-tasks
      - name: Retain Gradle TestKit reports for accepted or failed runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projectdb-gradle-testkit-jdk-${{ matrix.java }}
          path: |
            consumer-gradle/m3/quality-bridge/build/test-results/test/**
            consumer-gradle/m3/quality-bridge/build/reports/tests/test/**
          if-no-files-found: ignore
          retention-days: 14
