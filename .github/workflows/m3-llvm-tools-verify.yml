name: M3 LLVM Native Tools Provider

on:
  pull_request:
    paths:
      - 'tools/m3-llvm-tools-provider/**'
      - 'tools/m3-polyglot-maven-plugin/src/main/java/io/synexia/maven/polyglot/M3ToolCapability.java'
      - 'tools/m3-polyglot-maven-plugin/src/main/java/io/synexia/maven/polyglot/M3ToolProvider.java'
      - 'tools/m3-polyglot-maven-plugin/src/main/java/io/synexia/maven/polyglot/M3ToolProviders.java'
      - 'tools/m3-polyglot-maven-plugin/src/main/java/io/synexia/maven/polyglot/PolyglotCli.java'
      - 'tools/m3-polyglot-maven-plugin/src/main/resources/META-INF/services/io.synexia.maven.polyglot.M3ToolProvider'
      - '.github/workflows/m3-llvm-tools-verify.yml'
  push:
    branches: [master]
    paths:
      - 'tools/m3-llvm-tools-provider/**'
      - 'tools/m3-polyglot-maven-plugin/src/main/java/io/synexia/maven/polyglot/M3ToolCapability.java'
      - 'tools/m3-polyglot-maven-plugin/src/main/java/io/synexia/maven/polyglot/M3ToolProvider.java'
      - 'tools/m3-polyglot-maven-plugin/src/main/java/io/synexia/maven/polyglot/M3ToolProviders.java'
      - 'tools/m3-polyglot-maven-plugin/src/main/java/io/synexia/maven/polyglot/PolyglotCli.java'
      - 'tools/m3-polyglot-maven-plugin/src/main/resources/META-INF/services/io.synexia.maven.polyglot.M3ToolProvider'
      - '.github/workflows/m3-llvm-tools-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-plugin:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Java 17 standalone SPI contracts (no LLVM dependency)
        run: sh tools/m3-llvm-tools-provider/scripts/verify.sh
      - name: Install Maven polyglot dependency
        run: mvn -B --no-transfer-progress -f tools/m3-polyglot-maven-plugin/pom.xml install
      - name: Packaged optional provider and ServiceLoader contract
        run: mvn -B --no-transfer-progress -f tools/m3-llvm-tools-provider/pom.xml verify
      - name: Verify packaged LLVM tools ServiceLoader registration
        shell: bash
        run: |
          set -euo pipefail
          plugin=tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar
          provider=tools/m3-llvm-tools-provider/target/m3-llvm-tools-provider-0.1.0-SNAPSHOT.jar
          test -s "$plugin"
          test -s "$provider"
          jar tf "$provider" | grep -Fx 'META-INF/services/io.synexia.maven.polyglot.M3ToolProvider'
          jar tf "$provider" | grep -Fx 'io/synexia/maven/llvm/LlvmNativeToolsProvider.class'
          rows="$(java -cp "$plugin:$provider" io.synexia.maven.polyglot.PolyglotCli providers)"
          printf '%s\n' "$rows" | awk -F '\t' '$0=="M3-POLYGLOT-PROVIDERS-V1" { magic++ } $1=="provider" && $2=="llvm-tools" && NF==4 { selected++ } END { if (magic!=1 || selected!=1) exit 1 }'
      - name: Install explicit Ubuntu LLVM 18 IR toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends llvm-18 llvm-18-tools
          test -x /usr/lib/llvm-18/bin/opt
          test -x /usr/lib/llvm-18/bin/llvm-as
          test -x /usr/lib/llvm-18/bin/llvm-link
          /usr/lib/llvm-18/bin/opt --version
      - name: Required real LLVM IR DAG execution and cache-exclusion regression
        shell: bash
        env:
          M3_LLVM_PIPELINE_HOME: /usr/lib/llvm-18
        run: |
          set -euo pipefail
          plugin=tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar
          provider=tools/m3-llvm-tools-provider/target/m3-llvm-tools-provider-0.1.0-SNAPSHOT.jar
          test -s "$plugin"
          test -s "$provider"
          java -cp "tools/m3-llvm-tools-provider/target/test-classes:$plugin:$provider" \
            io.synexia.maven.llvm.LlvmNativePipelineIntegrationTestMain --required
      - name: Install explicit MLIR 18, Clang 18 and LLD 18
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends mlir-18-tools clang-18 lld-18
          test -x /usr/lib/llvm-18/bin/mlir-opt
          test -x /usr/lib/llvm-18/bin/mlir-translate
          test -x /usr/lib/llvm-18/bin/llvm-as
          test -x /usr/lib/llvm-18/bin/clang
          test -x /usr/lib/llvm-18/bin/ld.lld
          dpkg-query -W -f='${Package} ${Version}\n' llvm-18 llvm-18-tools mlir-18-tools clang-18 lld-18
          for tool in mlir-opt mlir-translate llvm-as clang ld.lld; do
            sha256sum "/usr/lib/llvm-18/bin/$tool"
          done
      - name: Required real MLIR translation and LLD ELF linking via packaged M3
        shell: bash
        env:
          M3_LLVM_PIPELINE_HOME: /usr/lib/llvm-18
        run: |
          set -euo pipefail
          plugin=tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar
          provider=tools/m3-llvm-tools-provider/target/m3-llvm-tools-provider-0.1.0-SNAPSHOT.jar
          test -s "$plugin"
          test -s "$provider"
          java -cp "tools/m3-llvm-tools-provider/target/test-classes:$plugin:$provider" \
            io.synexia.maven.llvm.LlvmMlirLldIntegrationTestMain --required
      - name: Verify explicit original LLVM 18 Wasm and COFF linkers
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/lib/llvm-18/bin/wasm-ld
          test -x /usr/lib/llvm-18/bin/lld-link
          for tool in clang wasm-ld lld-link; do
            sha256sum "/usr/lib/llvm-18/bin/$tool"
          done
      - name: Required real WebAssembly and PE/COFF linking through packaged M3
        shell: bash
        env:
          M3_LLVM_LINKER_HOME: /usr/lib/llvm-18
        run: |
          set -euo pipefail
          plugin=tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar
          provider=tools/m3-llvm-tools-provider/target/m3-llvm-tools-provider-0.1.0-SNAPSHOT.jar
          test -s "$plugin"
          test -s "$provider"
          java -cp "tools/m3-llvm-tools-provider/target/test-classes:$plugin:$provider" \
            io.synexia.maven.llvm.LlvmWasmCoffIntegrationTestMain --required
