# SPDX-License-Identifier: Apache-2.0
name: M3 Eclipse packet and compatible Windows LLVM host

on:
  pull_request:
    branches: [master, fix/m3-eclipse-packet-win2022-20261123]
    paths:
      - 'tools/m3-polyglot-maven-plugin/src/test/java/io/synexia/maven/polyglot/M3EclipseLanguageEvidenceServiceContractTestMain.java'
      - 'tools/m3-polyglot-maven-plugin/src/test/java/io/synexia/maven/polyglot/ProviderReuseExecutionTestMain.java'
      - '.github/workflows/m3-eclipse-packet-win2022-20261123.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-owner:
    name: Original Maven polyglot (${{ matrix.os }}, Java 21)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact recipe-reviewed original Java source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          expected = {
              "tools/m3-polyglot-maven-plugin/src/test/java/io/synexia/maven/polyglot/M3EclipseLanguageEvidenceServiceContractTestMain.java":
                  "a5b846a60452f980f17bc3ee0479cb6e8ee0d91c7fa074a95a67bae36365480b",
              "tools/m3-polyglot-maven-plugin/src/test/java/io/synexia/maven/polyglot/ProviderReuseExecutionTestMain.java":
                  "5552faa7ec457fdfa121894e30e0e06bcd138e0877702e01ed8057d0dde3610b",
          }
          for path_string, source_hash in expected.items():
              path = Path(path_string)
              stored = subprocess.check_output(["git", "show", "HEAD:" + path.as_posix()])
              found = hashlib.sha256(stored).hexdigest()
              if found != source_hash:
                  raise SystemExit("SOURCE_SEAL_DRIFT " + path_string + ": " + found)
              if path.read_bytes().replace(b"\r\n", b"\n") != stored:
                  raise SystemExit("CHECKOUT_CHANGED_BEYOND_CRLF " + path_string)
          print("PASS: two exact Git source images; checkout unchanged beyond CRLF")
          PY
      - name: Read and record real native toolchain identities
        shell: bash
        run: |
          set -euo pipefail
          java -version
          mvn --version
          clang --version
          clang++ --version
          if [ "$RUNNER_OS" = "Windows" ]; then
            # vswhere is installed with VS, but need not be on the runner's PATH.
            pwsh -NoProfile -Command '$exe = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\\Installer\\vswhere.exe"; if (Test-Path $exe) { & $exe -latest -products "*" -property installationVersion } else { Write-Output "VSWHERE_DIAGNOSTIC_UNAVAILABLE" }'
          fi
      - name: Execute original Maven polyglot module and all existing contract tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .m3-eclipse-packet-proof
          mvn -B -ntp -f tools/m3-polyglot-maven-plugin/pom.xml verify \
            2>&1 | tee .m3-eclipse-packet-proof/01-native-maven-module.log
      - name: Refuse source or test mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- tools/m3-polyglot-maven-plugin
      - name: Retain executed logs and native test evidence on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-eclipse-packet-${{ matrix.os }}-jdk21
          retention-days: 14
          if-no-files-found: warn
          path: |
            .m3-eclipse-packet-proof/
            tools/m3-polyglot-maven-plugin/target/surefire-reports/
