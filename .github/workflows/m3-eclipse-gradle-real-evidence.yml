# SPDX-License-Identifier: Apache-2.0
name: M3 Eclipse Maven-Gradle original descriptor acceptance
on:
  pull_request:
    paths:
      - 'tools/m3-polyglot-maven-plugin/**'
      - '.github/workflows/m3-eclipse-gradle-real-evidence.yml'
  push:
    branches: [master]
    paths:
      - 'tools/m3-polyglot-maven-plugin/**'
      - '.github/workflows/m3-eclipse-gradle-real-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-eclipse-model-gradle-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: tools/m3-polyglot-maven-plugin/pom.xml
      - name: Build and verify original Maven-owned polyglot Java engine
        run: |
          sh tools/m3-polyglot-maven-plugin/scripts/verify.sh
          mvn -B -ntp -f tools/m3-polyglot-maven-plugin/pom.xml verify
          jar=tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar
          test -s "$jar"
          sha256sum "$jar" | tee m3-eclipse-maven-jar.sha256
      - name: Checkout immutable reviewed Gradle Eclipse descriptor consumer
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/gradle
          # Merge of hsoliwal/gradle#47; never replace with a floating branch.
          ref: 6d3eb130f9d03a981f8322e426efefbde567e3cd
          path: consumer-gradle
          persist-credentials: false
          sparse-checkout: |
            gradlew
            gradle/wrapper
            m3/quality-bridge
      - name: Prepare original Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4
      - name: Execute real Maven JAR from Gradle TestKit (never a synthetic CLI)
        shell: bash
        env:
          M3_POLYGLOT_JAR: ${{ github.workspace }}/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar
        run: |
          set -euo pipefail
          sha256sum -c m3-eclipse-maven-jar.sha256
          test -s "$M3_POLYGLOT_JAR"
          chmod +x consumer-gradle/gradlew
          cd consumer-gradle
          attempt=1
          log="$RUNNER_TEMP/eclipse-jdk-${{ matrix.java }}.log"
          while :; do
            if ./gradlew --no-daemon --stacktrace --console=plain \
                -p m3/quality-bridge test \
                --tests 'io.synexia.gradle.quality.M3EclipseNativeDescriptorsRealEngineTest' \
                --rerun-tasks > "$log" 2>&1; then
              cat "$log"
              break
            else
              status=$?
              cat "$log"
              # Never retry a failed test or compilation. Maven Central HTTP
              # 429 is the sole transport exception, with two bounded retries.
              if [ "$attempt" -ge 3 ] \
                  || ! grep -Fq 'Received status code 429 from server: Too Many Requests' "$log" \
                  || ! grep -Fq 'https://repo.maven.apache.org/maven2/' "$log"; then
                exit "$status"
              fi
              echo "Rate-limited original dependency download; retry $attempt of 2" >&2
              sleep $((attempt * 20))
              attempt=$((attempt + 1))
            fi
          done
      - name: Require one real accepted test with no ignored cases
        shell: bash
        run: |
          set -euo pipefail
          test -s tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar
          sha256sum -c m3-eclipse-maven-jar.sha256
          report=consumer-gradle/m3/quality-bridge/build/test-results/test/TEST-io.synexia.gradle.quality.M3EclipseNativeDescriptorsRealEngineTest.xml
          test -s "$report"
          grep -Eq 'tests="1"' "$report"
          grep -Eq 'skipped="0"' "$report"
          grep -Eq 'failures="0"' "$report"
          grep -Eq 'errors="0"' "$report"
          grep -Eq '<testcase ' "$report"
      - name: Retain cross-fork Gradle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-eclipse-gradle-jdk-${{ matrix.java }}
          path: |
            m3-eclipse-maven-jar.sha256
            consumer-gradle/m3/quality-bridge/build/test-results/test/**
            consumer-gradle/m3/quality-bridge/build/reports/tests/test/**
          if-no-files-found: ignore
          retention-days: 14
