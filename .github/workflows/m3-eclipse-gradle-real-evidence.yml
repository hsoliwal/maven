# SPDX-License-Identifier: Apache-2.0
name: M3 Eclipse Maven-Gradle descriptor and JDT facts acceptance
on:
  pull_request:
    paths:
      - 'tools/m3-polyglot-maven-plugin/**'
      - '.github/workflows/m3-eclipse-gradle-real-evidence.yml'
  push:
    branches: [master]
    paths:
      - 'tools/m3-polyglot-maven-plugin/**'
      - '.github/workflows/m3-eclipse-gradle-real-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-eclipse-model-gradle-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: tools/m3-polyglot-maven-plugin/pom.xml
      - name: Build and verify original Maven-owned polyglot Java engine
        run: |
          sh tools/m3-polyglot-maven-plugin/scripts/verify.sh
          mvn -B -ntp -f tools/m3-polyglot-maven-plugin/pom.xml verify
          jar=tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar
          test -s "$jar"
          sha256sum "$jar" | tee m3-eclipse-maven-jar.sha256
      - name: Checkout immutable reviewed Gradle Eclipse model and JDT facts consumer
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/gradle
          # Merge of hsoliwal/gradle#63, containing #47 plus source-owned JDT bridge.
          # Never replace this with floating 'master' or an unreviewed checkout.
          ref: c918c9b9dfc3b087987165c43b77dff63cc86fb1
          path: consumer-gradle
          persist-credentials: false
          sparse-checkout: |
            gradlew
            gradle/wrapper
            m3/quality-bridge
      - name: Prepare original Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4
      - name: Execute real Maven JAR from Gradle TestKit (never a synthetic CLI)
        shell: bash
        env:
          M3_POLYGLOT_JAR: ${{ github.workspace }}/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar
        run: |
          set -euo pipefail
          sha256sum -c m3-eclipse-maven-jar.sha256
          test -s "$M3_POLYGLOT_JAR"
          chmod +x consumer-gradle/gradlew
          cd consumer-gradle
          attempt=1
          log="$RUNNER_TEMP/eclipse-jdk-${{ matrix.java }}.log"
          while :; do
            if ./gradlew --no-daemon --stacktrace --console=plain \
                -p m3/quality-bridge test \
                --tests 'io.synexia.gradle.quality.M3EclipseNativeDescriptorsRealEngineTest' \
                --tests 'io.synexia.gradle.quality.M3EclipseJdtRealEngineTest' \
                --rerun-tasks > "$log" 2>&1; then
              cat "$log"
              break
            else
              status=$?
              cat "$log"
              # Never retry a failed test or compilation. Maven Central HTTP
              # 429 is the sole transport exception, with two bounded retries.
              if [ "$attempt" -ge 3 ] \
                  || ! grep -Fq 'Received status code 429 from server: Too Many Requests' "$log" \
                  || ! grep -Fq 'https://repo.maven.apache.org/maven2/' "$log"; then
                exit "$status"
              fi
              echo "Rate-limited original dependency download; retry $attempt of 2" >&2
              sleep $((attempt * 20))
              attempt=$((attempt + 1))
            fi
          done
      - name: Require both real accepted tests with no ignored cases
        shell: bash
        run: |
          set -euo pipefail
          test -s tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar
          sha256sum -c m3-eclipse-maven-jar.sha256
          for qualified in M3EclipseNativeDescriptorsRealEngineTest M3EclipseJdtRealEngineTest; do
            report="consumer-gradle/m3/quality-bridge/build/test-results/test/TEST-io.synexia.gradle.quality.${qualified}.xml"
            test -s "$report"
            case "$qualified" in
              M3EclipseNativeDescriptorsRealEngineTest) minimum=3 ;;
              M3EclipseJdtRealEngineTest) minimum=1 ;;
              *) echo "Unknown required acceptance suite: $qualified" >&2; exit 1 ;;
            esac
            # The descriptor suite has three real tests; more may be added.
            # Require every declared case to have run and no skipped/failing nodes.
            python3 - "$report" "$minimum" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          suite = ET.parse(sys.argv[1]).getroot()
          minimum = int(sys.argv[2])
          cases = suite.findall("testcase")
          actual = int(suite.attrib.get("tests", "-1"))
          if suite.tag != "testsuite" or actual < minimum or actual != len(cases):
              raise SystemExit(f"JUnit test count mismatch: actual={actual}, cases={len(cases)}, min={minimum}")
          if any(int(suite.attrib.get(field, "-1")) != 0 for field in ("skipped", "failures", "errors")):
              raise SystemExit("JUnit suite contains skipped, failed, or errored tests")
          if any(case.find(event) is not None for case in cases for event in ("skipped", "failure", "error")):
              raise SystemExit("JUnit individual test contains an unreported non-success result")
          print(f"PASS: {suite.attrib['name']} {actual} executed acceptance cases")
          PY
          done
      - name: Retain cross-fork Gradle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-eclipse-gradle-jdk-${{ matrix.java }}
          path: |
            m3-eclipse-maven-jar.sha256
            consumer-gradle/m3/quality-bridge/build/test-results/test/**
            consumer-gradle/m3/quality-bridge/build/reports/tests/test/**
          if-no-files-found: ignore
          retention-days: 14
