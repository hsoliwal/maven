name: M3 LLVM exact-fork source-built Maven native proof

on:
  pull_request:
    paths:
      - '.github/workflows/m3-llvm-fork-source-proof.yml'
      - 'tools/m3-polyglot-maven-plugin/scripts/verify-pinned-llvm-fork.sh'
      - 'tools/m3-polyglot-maven-plugin/docs/LLVM_FORK_SOURCE_PROOF.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-built-clang-llc:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out reviewed Maven fork
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Java 21 for the Maven native consumer
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch exactly pinned LLVM fork source with sparse partial clone
        shell: bash
        run: |
          set -euo pipefail
          git init -q llvm-source
          git -C llvm-source remote add origin https://github.com/hsoliwal/llvm-project.git
          git -C llvm-source sparse-checkout init --cone
          git -C llvm-source sparse-checkout set llvm clang cmake third-party libc
          git -C llvm-source -c protocol.version=2 fetch --depth=1 --filter=blob:none origin \
            591f3d1edf0a9ee718d17a0ee70dd013b3c01908
          git -C llvm-source checkout --detach --force FETCH_HEAD
          test "$(git -C llvm-source rev-parse HEAD)" = \
            591f3d1edf0a9ee718d17a0ee70dd013b3c01908
      - name: Install reproducible host build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build build-essential
          command -v mvn
          command -v java
          command -v ninja
      - name: Compile source-pinned LLVM Clang and llc, execute original Maven TaskRunner
        shell: bash
        run: |
          set -euo pipefail
          bash tools/m3-polyglot-maven-plugin/scripts/verify-pinned-llvm-fork.sh \
            "$GITHUB_WORKSPACE/llvm-source" \
            "$RUNNER_TEMP/m3-llvm-original-build" \
            "$RUNNER_TEMP/m3-llvm-fork-native-receipt"
      - name: Retain exact-source and original binary execution receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-llvm-fork-source-native-jdk21
          path: |
            ${{ runner.temp }}/m3-llvm-fork-native-receipt/*
            ${{ runner.temp }}/m3-llvm-original-build/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 14
