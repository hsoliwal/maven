name: M3 LLVM exact-fork source-built Maven native proof

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/m3-llvm-fork-source-proof.yml'
      - 'tools/m3-polyglot-maven-plugin/scripts/verify-pinned-llvm-fork.sh'
      - 'tools/m3-polyglot-maven-plugin/docs/LLVM_FORK_SOURCE_PROOF.md'
      - 'tools/m3-polyglot-maven-plugin/scripts/verify-llvm-fork-source-triggers.py'
      - 'tools/m3-polyglot-maven-plugin/scripts/test_verify_llvm_fork_source_triggers.py'
      - 'tools/m3-polyglot-maven-plugin/docs/LLVM_SOURCE_PROOF_TRIGGER_HARDENING.md'
      - 'tools/m3-polyglot-maven-plugin/pom.xml'
      - 'tools/m3-polyglot-maven-plugin/src/main/java/io/synexia/maven/polyglot/LlvmCompilerProvider.java'
      - 'tools/m3-polyglot-maven-plugin/src/main/java/io/synexia/maven/polyglot/M3ToolProvider.java'
      - 'tools/m3-polyglot-maven-plugin/src/main/java/io/synexia/maven/polyglot/M3ToolProviders.java'
      - 'tools/m3-polyglot-maven-plugin/src/main/java/io/synexia/maven/polyglot/M3ToolReuseInputs.java'
      - 'tools/m3-polyglot-maven-plugin/src/main/java/io/synexia/maven/polyglot/TaskRunner.java'
      - 'tools/m3-polyglot-maven-plugin/src/main/java/io/synexia/maven/polyglot/TaskManifest.java'
      - 'tools/m3-polyglot-maven-plugin/src/main/java/io/synexia/maven/polyglot/InputStamps.java'
      - 'tools/m3-polyglot-maven-plugin/src/main/java/io/synexia/maven/polyglot/BuildCache.java'
      - 'tools/m3-polyglot-maven-plugin/src/test/java/io/synexia/maven/polyglot/LlvmCompilerIntegrationTestMain.java'
      - 'tools/m3-polyglot-maven-plugin/src/main/resources/META-INF/services/io.synexia.maven.polyglot.M3ToolProvider'
      - 'tools/m3-polyglot-maven-plugin/scripts/verify-pinned-llvm-ir-tools.sh'
      - 'tools/m3-polyglot-maven-plugin/scripts/test_verify_pinned_llvm_ir_tools.py'
      - 'tools/m3-llvm-tools-provider/src/main/java/io/synexia/maven/llvm/LlvmNativeToolsProvider.java'
      - 'tools/m3-llvm-tools-provider/src/main/java/io/synexia/maven/llvm/LlvmToolchainEvidence.java'
      - 'tools/m3-llvm-tools-provider/src/test/java/io/synexia/maven/llvm/LlvmNativePipelineIntegrationTestMain.java'
      - 'tools/m3-llvm-tools-provider/src/main/resources/META-INF/services/io.synexia.maven.polyglot.M3ToolProvider'
  pull_request:
    paths:
      - '.github/workflows/m3-llvm-fork-source-proof.yml'
      - 'tools/m3-polyglot-maven-plugin/scripts/verify-pinned-llvm-fork.sh'
      - 'tools/m3-polyglot-maven-plugin/docs/LLVM_FORK_SOURCE_PROOF.md'
      - 'tools/m3-polyglot-maven-plugin/scripts/verify-llvm-fork-source-triggers.py'
      - 'tools/m3-polyglot-maven-plugin/scripts/test_verify_llvm_fork_source_triggers.py'
      - 'tools/m3-polyglot-maven-plugin/docs/LLVM_SOURCE_PROOF_TRIGGER_HARDENING.md'
      - 'tools/m3-polyglot-maven-plugin/pom.xml'
      - 'tools/m3-polyglot-maven-plugin/src/main/java/io/synexia/maven/polyglot/LlvmCompilerProvider.java'
      - 'tools/m3-polyglot-maven-plugin/src/main/java/io/synexia/maven/polyglot/M3ToolProvider.java'
      - 'tools/m3-polyglot-maven-plugin/src/main/java/io/synexia/maven/polyglot/M3ToolProviders.java'
      - 'tools/m3-polyglot-maven-plugin/src/main/java/io/synexia/maven/polyglot/M3ToolReuseInputs.java'
      - 'tools/m3-polyglot-maven-plugin/src/main/java/io/synexia/maven/polyglot/TaskRunner.java'
      - 'tools/m3-polyglot-maven-plugin/src/main/java/io/synexia/maven/polyglot/TaskManifest.java'
      - 'tools/m3-polyglot-maven-plugin/src/main/java/io/synexia/maven/polyglot/InputStamps.java'
      - 'tools/m3-polyglot-maven-plugin/src/main/java/io/synexia/maven/polyglot/BuildCache.java'
      - 'tools/m3-polyglot-maven-plugin/src/test/java/io/synexia/maven/polyglot/LlvmCompilerIntegrationTestMain.java'
      - 'tools/m3-polyglot-maven-plugin/src/main/resources/META-INF/services/io.synexia.maven.polyglot.M3ToolProvider'
      - 'tools/m3-polyglot-maven-plugin/scripts/verify-pinned-llvm-ir-tools.sh'
      - 'tools/m3-polyglot-maven-plugin/scripts/test_verify_pinned_llvm_ir_tools.py'
      - 'tools/m3-llvm-tools-provider/src/main/java/io/synexia/maven/llvm/LlvmNativeToolsProvider.java'
      - 'tools/m3-llvm-tools-provider/src/main/java/io/synexia/maven/llvm/LlvmToolchainEvidence.java'
      - 'tools/m3-llvm-tools-provider/src/test/java/io/synexia/maven/llvm/LlvmNativePipelineIntegrationTestMain.java'
      - 'tools/m3-llvm-tools-provider/src/main/resources/META-INF/services/io.synexia.maven.polyglot.M3ToolProvider'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-built-clang-llc:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out reviewed Maven fork
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Java 21 for the Maven native consumer
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Refuse incomplete exact-fork invalidation triggers
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/m3-polyglot-maven-plugin/scripts/test_verify_llvm_fork_source_triggers.py
          python3 -B tools/m3-polyglot-maven-plugin/scripts/verify-llvm-fork-source-triggers.py
          python3 -B tools/m3-polyglot-maven-plugin/scripts/test_verify_pinned_llvm_ir_tools.py
      - name: Fetch exactly pinned LLVM fork source with sparse partial clone
        shell: bash
        run: |
          set -euo pipefail
          git init -q llvm-source
          git -C llvm-source remote add origin https://github.com/hsoliwal/llvm-project.git
          git -C llvm-source sparse-checkout init --cone
          git -C llvm-source sparse-checkout set llvm clang cmake third-party libc
          git -C llvm-source -c protocol.version=2 fetch --depth=1 --filter=blob:none origin \
            591f3d1edf0a9ee718d17a0ee70dd013b3c01908
          git -C llvm-source checkout --detach --force FETCH_HEAD
          test "$(git -C llvm-source rev-parse HEAD)" = \
            591f3d1edf0a9ee718d17a0ee70dd013b3c01908
      - name: Install reproducible host build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build build-essential
          command -v mvn
          command -v java
          command -v ninja
      - name: Prove refusal before output creation on invalid checkout
        shell: bash
        run: |
          set -euo pipefail
          script=tools/m3-polyglot-maven-plugin/scripts/verify-pinned-llvm-fork.sh
          bash -n "$script"
          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          mkdir -p "$temporary/source"
          git -C "$temporary/source" init -q
          git -C "$temporary/source" -c user.name=M3 -c user.email=m3@example.invalid \
            commit --allow-empty -qm invalid-checkout
          verify_refusal() {
            local expected="$1"
            shift
            local actual=0
            bash "$script" "$@" > "$temporary/refused.log" 2>&1 || actual="$?"
            if [ "$actual" -ne "$expected" ]; then
              printf 'expected exit %s, observed %s\n' "$expected" "$actual" >&2
              cat "$temporary/refused.log" >&2
              exit 1
            fi
          }
          verify_refusal 64
          verify_refusal 65 "$temporary/source" "$temporary/source/unsafe-build" "$temporary/evidence"
          test ! -e "$temporary/source/unsafe-build"
          test ! -e "$temporary/evidence"
          verify_refusal 65 "$temporary/source" "$temporary/same-output" "$temporary/same-output"
          test ! -e "$temporary/same-output"
          verify_refusal 66 "$temporary/source" "$temporary/rejected-build" "$temporary/rejected-evidence"
          test ! -e "$temporary/rejected-build"
          test ! -e "$temporary/rejected-evidence"
          test -z "$(git -C "$temporary/source" status --porcelain --untracked-files=normal)"
          # The *real pinned checkout* must also refuse occupied outputs without
          # reusing a foreign CMake cache or previous success receipt.
          mkdir -p "$temporary/stale build"
          printf 'CMAKE_HOME_DIRECTORY=/foreign/source\n' > "$temporary/stale build/CMakeCache.txt"
          verify_refusal 65 "$GITHUB_WORKSPACE/llvm-source" \
            "$temporary/stale build" "$temporary/no-evidence"
          test "$(cat "$temporary/stale build/CMakeCache.txt")" = \
            'CMAKE_HOME_DIRECTORY=/foreign/source'
          test ! -e "$temporary/no-evidence"
          mkdir -p "$temporary/stale evidence"
          printf 'source_built_clang_llc_maven_native\tPASS\n' > \
            "$temporary/stale evidence/source-receipt.tsv"
          verify_refusal 65 "$GITHUB_WORKSPACE/llvm-source" \
            "$temporary/no-build" "$temporary/stale evidence"
          test "$(cat "$temporary/stale evidence/source-receipt.tsv")" = \
            "$(printf 'source_built_clang_llc_maven_native\tPASS')"
          test ! -e "$temporary/no-build"
          echo 'PASS: pin, overlap and stale-output refusals create no outputs'
      - name: Refuse unreadable or failed native proof output scans
        shell: bash
        run: |
          set -euo pipefail
          script=tools/m3-polyglot-maven-plugin/scripts/verify-pinned-llvm-fork.sh
          test "$(id -u)" -ne 0
          temporary="$(mktemp -d)"
          trap 'chmod 700 "$temporary/unreadable" "$temporary/unreadable-parent" "$temporary/readonly" 2>/dev/null || :; rm -rf "$temporary"' EXIT
          mkdir -p "$temporary/unreadable"
          chmod 000 "$temporary/unreadable"
          assert_scan_refusal() {
            local status=0
            bash "$script" "$GITHUB_WORKSPACE/llvm-source" "$1" "$2" \
              > "$temporary/refused.log" 2>&1 || status="$?"
            if [[ "$status" -ne 65 ]]; then
              printf 'expected inaccessible output exit 65, got %s\n' "$status" >&2
              cat "$temporary/refused.log" >&2
              exit 1
            fi
            grep -F 'LLVM proof cannot inspect output directory:' "$temporary/refused.log"
            test ! -e "$2"
          }
          assert_scan_refusal "$temporary/unreadable" "$temporary/refused-evidence"
          chmod 700 "$temporary/unreadable"
          # A child of an unreadable parent looks absent to [[ -e ]], but
          # creating it may still leave another output directory behind.
          mkdir -p "$temporary/unreadable-parent"
          chmod 000 "$temporary/unreadable-parent"
          assert_scan_refusal "$temporary/unreadable-parent/child" "$temporary/refused-evidence"
          test ! -e "$temporary/refused-evidence"
          chmod 700 "$temporary/unreadable-parent"
          mkdir -p "$temporary/readonly"
          chmod 500 "$temporary/readonly"
          assert_scan_refusal "$temporary/readonly" "$temporary/refused-evidence"
          chmod 700 "$temporary/readonly"
          mkdir -p "$temporary/bin" "$temporary/empty"
          printf '#!/usr/bin/env bash\nexit 72\n' > "$temporary/bin/find"
          chmod +x "$temporary/bin/find"
          PATH="$temporary/bin:$PATH" assert_scan_refusal \
            "$temporary/empty" "$temporary/refused-evidence"
          echo 'PASS: native proof refuses unreadable and failing directory scans without output'
      - name: Compile source-pinned LLVM Clang and llc, execute original Maven TaskRunner
        shell: bash
        run: |
          set -euo pipefail
          bash tools/m3-polyglot-maven-plugin/scripts/verify-pinned-llvm-fork.sh \
            "$GITHUB_WORKSPACE/llvm-source" \
            "$RUNNER_TEMP/m3-llvm-original-build" \
            "$RUNNER_TEMP/m3-llvm-fork-native-receipt"
      - name: Select Java 17 for independent source-built LLVM qualification
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Recompile and run the exact source-built native regression under Java 17
        shell: bash
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/m3-llvm-original-build"
          evidence="$RUNNER_TEMP/m3-llvm-fork-native-receipt"
          project="$GITHUB_WORKSPACE/tools/m3-polyglot-maven-plugin"
          source="$GITHUB_WORKSPACE/llvm-source"
          test "$(git -C "$source" rev-parse HEAD)" = \
            591f3d1edf0a9ee718d17a0ee70dd013b3c01908
          test -f "$evidence/source-receipt.tsv"
          grep -Fxq $'source_built_clang_llc_maven_native\tPASS' "$evidence/source-receipt.tsv"
          java -version 2>&1 | tee "$evidence/java17-version.log" | grep -Eq 'version "17([.]|")'
          mvn --version | tee "$evidence/maven17-version.log" | grep -Eq 'Java version: 17([.]|,|$)'
          for tool in clang clang++ llc opt llvm-as llvm-link; do
            test -x "$build/bin/$tool"
          done
          for tool in clang clang++ llc opt llvm-as llvm-link; do
            sha256sum "$build/bin/$tool"
          done > "$evidence/jdk17-binaries-before.sha256"
          mvn -B -ntp -f "$project/pom.xml" clean test-compile \
            2>&1 | tee "$evidence/maven-jdk17-test-compile.log"
          test -f "$project/target/test-classes/io/synexia/maven/polyglot/LlvmCompilerIntegrationTestMain.class"
          (
            cd "$GITHUB_WORKSPACE"
            M3_POLYGLOT_LLVM_TEST_HOME="$build" java \
              -cp "$project/target/test-classes:$project/target/classes" \
              io.synexia.maven.polyglot.LlvmCompilerIntegrationTestMain --required
          ) 2>&1 | tee "$evidence/maven-native-jdk17.log"
          for requirement in \
            'PASS: LLVM C17/C++20 compile/link/run' \
            'PASS: LLVM IR llc object, clang link and native run' \
            'PASS: Objective-C and both Objective-C++ spellings compile' \
            'LLVM native integration assertions'; do
            grep -Fq "$requirement" "$evidence/maven-native-jdk17.log" || {
              printf 'Missing Java 17 source-built native proof: %s\n' "$requirement" >&2
              exit 68
            }
          done
          for tool in clang clang++ llc opt llvm-as llvm-link; do
            sha256sum "$build/bin/$tool"
          done > "$evidence/jdk17-binaries-after.sha256"
          cmp "$evidence/jdk17-binaries-before.sha256" \
            "$evidence/jdk17-binaries-after.sha256"
          printf 'source_built_clang_llc_maven_native_jdk17\tPASS\n' >> "$evidence/source-receipt.tsv"
          echo 'PASS: exact source-built Clang/Clang++/llc native regression under Java 17'
      - name: Qualify the same source-built LLVM IR toolchain on Java 17
        shell: bash
        run: |
          set -euo pipefail
          bash tools/m3-polyglot-maven-plugin/scripts/verify-pinned-llvm-ir-tools.sh \
            "$GITHUB_WORKSPACE/llvm-source" \
            "$RUNNER_TEMP/m3-llvm-original-build" \
            "$RUNNER_TEMP/m3-llvm-fork-native-receipt" 17
      - name: Retain exact-source and original binary execution receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-llvm-fork-source-native-jdk21
          path: |
            ${{ runner.temp }}/m3-llvm-fork-native-receipt/*
            ${{ runner.temp }}/m3-llvm-original-build/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 14
