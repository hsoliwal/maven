# SPDX-License-Identifier: Apache-2.0
name: M3 Maven Git fixture Windows cleanup proof

on:
  pull_request:
    paths:
      - 'impl/maven-cli/src/test/java/org/apache/maven/cling/M3GitHubPatchBootstrapSelfTest.java'
      - '.github/workflows/m3-git-fixture-cleanup.yml'
  push:
    branches:
      - fix/m3-patch-git-fixture-windows-cleanup-20261027
    paths:
      - 'impl/maven-cli/src/test/java/org/apache/maven/cling/M3GitHubPatchBootstrapSelfTest.java'
      - '.github/workflows/m3-git-fixture-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-original-source:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile only original Maven bootstrap owners, strict Java17
        shell: bash
        run: |
          set -euo pipefail
          out=target/m3-git-bootstrap-source-proof
          mkdir -p "$out"
          javac --release 17 -proc:none -encoding UTF-8 -Xlint:all -Werror -d "$out" \
            impl/maven-cli/src/main/java/org/apache/maven/cling/M3ChromeAiReviewPacket.java \
            impl/maven-cli/src/main/java/org/apache/maven/cling/M3GitHubPatchBootstrap.java \
            impl/maven-cli/src/test/java/org/apache/maven/cling/M3GitHubPatchBootstrapSelfTest.java
      - name: Real-Git fixture selftest, normal and interpreted modes
        shell: bash
        run: |
          set -euo pipefail
          out=target/m3-git-bootstrap-source-proof
          java -cp "$out" org.apache.maven.cling.M3GitHubPatchBootstrapSelfTest
          java -Xint -cp "$out" org.apache.maven.cling.M3GitHubPatchBootstrapSelfTest
      - name: Source hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
