name: Maven 4 M3JDK native build tools
on:
  pull_request:
    paths:
      - 'api/maven-api-core/src/main/java/org/apache/maven/api/services/M3BuildToolsService.java'
      - 'impl/maven-impl/src/main/java/org/apache/maven/impl/DefaultM3BuildToolsService.java'
      - 'impl/maven-impl/src/test/java/org/apache/maven/impl/DefaultM3BuildToolsServiceTest.java'
      - '.github/workflows/m3-maven-buildtools.yml'
      - 'm3/recipe-custody/maven-buildtools-budget-20261031.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-maven-api-and-impl:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Validate canonical source-sealed Maven receiving facts
        shell: bash
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          receipt = json.loads(Path('m3/recipe-custody/maven-buildtools-budget-20261031.json').read_text())
          assert len(receipt['targets']) == 2
          for target in receipt['targets']:
              path = Path(target['path'])
              assert path.is_file() and not path.is_symlink(), path
              assert sha256(path.read_bytes()).hexdigest() == target['received_sha256'], path
          print('M3_MAVEN_BUILDTOOLS_CANONICAL_RECEIVER_PASS targets=2')
          PY
      - name: Exercise the original Maven 4 API/DI/JUnit reactor
        run: |
          mvn -B -ntp -pl impl/maven-impl -am \
            -Dtest=DefaultM3BuildToolsServiceTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
