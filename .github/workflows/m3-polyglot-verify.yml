# SPDX-License-Identifier: Apache-2.0
name: M3 Polyglot Maven Plugin

on:
  pull_request:
    paths:
      - 'tools/m3-polyglot-maven-plugin/**'
      - '.github/workflows/m3-polyglot-verify.yml'
  push:
    branches: [master]
    paths:
      - 'tools/m3-polyglot-maven-plugin/**'
      - '.github/workflows/m3-polyglot-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-plugin:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Source contract and provider argv tests
        run: sh tools/m3-polyglot-maven-plugin/scripts/verify.sh
      - name: Maven plugin descriptor, compile and contract verification
        run: mvn --batch-mode --no-transfer-progress -f tools/m3-polyglot-maven-plugin/pom.xml verify
