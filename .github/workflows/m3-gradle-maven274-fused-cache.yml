name: M3 Gradle original Maven 274 fused state and portable cache acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/m3-gradle-maven274-fused-cache.yml'
      - 'tools/project-db/scripts/verify-gradle-maven274-fused-cache.sh'
      - 'tools/project-db/GRADLE_MAVEN274_FUSED_CACHE.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-maven274-through-gradle:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Verify source pins and three positive/negative cache-state cases
        shell: bash
        run: |
          set -euo pipefail
          sh tools/project-db/scripts/verify-gradle-maven274-fused-cache.sh
      - name: Checkout exact original Maven 274 owner with fused fingerprints
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/maven
          ref: 53d7bd782077968e596a54cb7948ea22810734c3
          path: source-maven-274
          persist-credentials: false
      - name: Execute original Maven #274 source-built plugin and fused SHA contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source-maven-274 rev-parse HEAD)" = 53d7bd782077968e596a54cb7948ea22810734c3
          mvn -B -ntp -f source-maven-274/tools/m3-polyglot-maven-plugin/pom.xml verify 2>&1 | tee m3-maven274-original.log
          grep -Fq 'build-cache/module-state integration checks' m3-maven274-original.log
          test -s source-maven-274/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar
          jar tf source-maven-274/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar |
            grep -Fx 'io/synexia/maven/polyglot/TaskRunner.class'
      - name: Source/JDK seal original Maven runtime JAR, no Gradle cache admission
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualified
          cp source-maven-274/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar qualified/polyglot.jar
          printf 'M3-FUSED-MAVEN274-V1\t%s\t%s\t%s\n' \
            53d7bd782077968e596a54cb7948ea22810734c3 \
            c37aebffa4a7040f2bb5d1f783ce18237354fd90 \
            '${{ matrix.java }}' > qualified/SOURCE_RECEIPT.tsv
          (cd qualified && sha256sum polyglot.jar SOURCE_RECEIPT.tsv > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Checkout exact Gradle deleted-output regression
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/gradle
          ref: c37aebffa4a7040f2bb5d1f783ce18237354fd90
          path: consumer-gradle
          persist-credentials: false
          sparse-checkout: |
            gradlew
            gradle/wrapper
            m3/quality-bridge
      - name: Require original Maven and Gradle source SHA and JDK receipt
        shell: bash
        run: |
          set -euo pipefail
          (cd qualified && sha256sum -c SHA256SUMS)
          test "$(git -C consumer-gradle rev-parse HEAD)" = c37aebffa4a7040f2bb5d1f783ce18237354fd90
          test "$(git -C consumer-gradle hash-object m3/quality-bridge/src/test/java/io/synexia/gradle/quality/M3FusedStateCacheRealEngineTest.java)" = 075444a7b403d890729c5924915a3bf6cae4f5bc
          expected=$(printf 'M3-FUSED-MAVEN274-V1\t%s\t%s\t%s' \
            53d7bd782077968e596a54cb7948ea22810734c3 \
            c37aebffa4a7040f2bb5d1f783ce18237354fd90 \
            '${{ matrix.java }}')
          test "$(cat qualified/SOURCE_RECEIPT.tsv)" = "$expected"
      - name: Execute real cross-checkout fused Maven cache and Gradle TestKit
        shell: bash
        env:
          M3_REQUIRE_FUSED_REAL_ENGINE: '1'
        run: |
          set -euo pipefail
          export M3_FUSED_MAVEN_ENGINE_JAR="$GITHUB_WORKSPACE/qualified/polyglot.jar"
          test -s "$M3_FUSED_MAVEN_ENGINE_JAR"
          chmod +x consumer-gradle/gradlew
          cd consumer-gradle
          ./gradlew --no-daemon --stacktrace --console=plain \
            -p m3/quality-bridge test \
            --tests 'io.synexia.gradle.quality.M3FusedStateCacheRealEngineTest' \
            --rerun-tasks
      - name: Admit only three actual non-skipped source-owned TestKit receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          p = Path('consumer-gradle/m3/quality-bridge/build/test-results/test/TEST-io.synexia.gradle.quality.M3FusedStateCacheRealEngineTest.xml')
          assert p.is_file() and not p.is_symlink() and p.stat().st_size < 1024*1024
          raw = p.read_bytes()
          assert b'<!DOCTYPE' not in raw and b'<!ENTITY' not in raw
          node = ET.fromstring(raw)
          class_name='io.synexia.gradle.quality.M3FusedStateCacheRealEngineTest'
          assert node.tag=='testsuite' and node.attrib.get('name')==class_name
          assert all(node.attrib.get(k)==str(v) for k,v in (('tests',3),('skipped',0),('failures',0),('errors',0)))
          wanted={
              'originalMavenFusedKeysPreservePortableRestoreLocalReuseAndContentInvalidation()',
              'missingDeclaredInputMustNotAuthorizeStaleCacheRestoration()',
              'wrongEngineShaAndUnsafeCachePathsRefuseBeforeRunningMaven()',
          }
          cases=[c for c in node if c.tag=='testcase']
          assert len(cases)==3 and {c.attrib.get('name') for c in cases}==wanted
          assert all(c.attrib.get('classname')==class_name and not list(c) for c in cases)
          print('PASS: original Maven 274 fused keys via three actual Gradle TestKit cases')
          PY
          (cd qualified && sha256sum -c SHA256SUMS)
          git -C consumer-gradle diff --exit-code --quiet
      - name: Retain real Maven/Gradle runtime evidence and source digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-gradle-maven274-fused-jdk-${{ matrix.java }}
          path: |
            m3-maven274-original.log
            qualified/polyglot.jar
            qualified/SOURCE_RECEIPT.tsv
            qualified/SHA256SUMS
            consumer-gradle/m3/quality-bridge/build/test-results/test/**
            consumer-gradle/m3/quality-bridge/build/reports/tests/test/**
          if-no-files-found: warn
          retention-days: 14

  gradle-ide-delta-build-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Guard the additive identity lane and preserve the original fused lane
        shell: bash
        run: sh tools/project-db/scripts/verify-gradle-maven274-fused-cache.sh --identity
      - name: Checkout exact Gradle included-build identity owner
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/gradle
          ref: 507d1830b61bb6afaaf80268f0f6e815d7c9ee01
          path: consumer-gradle-identity
          persist-credentials: false
          sparse-checkout: |
            gradlew
            gradle/wrapper
            m3/quality-bridge
      - name: Refuse changed Gradle sources and seal the complete original compile closure
        shell: bash
        run: |
          set -euo pipefail
          test ! -e consumer-gradle-identity/m3/quality-bridge/build
          mkdir -p qualified-identity
          python3 - <<'PY_SOURCE'
          from pathlib import Path, PurePosixPath
          import hashlib
          import json
          import subprocess
          root = Path('consumer-gradle-identity')
          assert root.is_dir() and not root.is_symlink()
          def git(*args):
              return subprocess.check_output(['git', '-C', str(root), *args])
          ref = '507d1830b61bb6afaaf80268f0f6e815d7c9ee01'
          module = '36a98dcba8578d34a418739afcbae53ab5de3e0f'
          assert git('rev-parse', 'HEAD').decode().strip() == ref
          assert git('rev-parse', 'HEAD:m3/quality-bridge').decode().strip() == module
          scopes = ['gradlew', 'gradle/wrapper', 'm3/quality-bridge/build.gradle.kts',
                    'm3/quality-bridge/settings.gradle.kts', 'm3/quality-bridge/src']
          records = git('ls-tree', '-rz', 'HEAD', '--', *scopes).split(b'\0')
          rows = []
          for record in filter(None, records):
              header, encoded_path = record.split(b'\t', 1)
              mode, kind, expected = header.decode().split()
              path = encoded_path.decode('utf-8')
              relative = PurePosixPath(path)
              assert not relative.is_absolute() and '..' not in relative.parts
              assert relative.as_posix() == path and kind == 'blob'
              assert mode in ('100644', '100755')
              source = root
              for part in relative.parts:
                  source = source / part
                  assert not source.is_symlink()
              assert source.is_file()
              raw = source.read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              assert actual == expected, path
              assert bool(source.stat().st_mode & 0o111) == (mode == '100755'), path
              rows.append({'path': path, 'mode': mode, 'git_blob': expected,
                           'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()})
          assert rows and len({row['path'] for row in rows}) == len(rows)
          tracked_java = {row['path'] for row in rows if row['path'].endswith('.java')}
          actual_java = {p.relative_to(root).as_posix()
                         for p in (root / 'm3/quality-bridge/src').rglob('*.java')}
          assert actual_java == tracked_java
          assert not git('ls-files', '--others', '--exclude-standard', '--', *scopes).strip()
          assert not git('ls-files', '--others', '--ignored', '--exclude-standard',
                         '--', 'm3/quality-bridge/src').strip()
          git('diff', '--exit-code', '--quiet', 'HEAD')
          receipt = {'schema': 'M3_GRADLE78_SOURCE_INPUTS_V1', 'ref': ref,
                     'module_tree': module, 'files': rows}
          Path('qualified-identity/SOURCE_INPUTS.json').write_text(
              json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          print('PASS: exact Gradle 78 module tree and', len(rows), 'original compile inputs')
          PY_SOURCE
          printf 'M3-GRADLE78-IDENTITY-V1\t%s\t%s\t%s\n' \
            507d1830b61bb6afaaf80268f0f6e815d7c9ee01 \
            36a98dcba8578d34a418739afcbae53ab5de3e0f \
            '${{ matrix.java }}' > qualified-identity/SOURCE_RECEIPT.tsv
          java -XshowSettings:properties -version 2>&1 | tee qualified-identity/java-version.log
          grep -Eq '^[[:space:]]*java[.]specification[.]version = ${{ matrix.java }}$' qualified-identity/java-version.log
          (cd consumer-gradle-identity && ./gradlew --no-daemon --version) 2>&1 | tee qualified-identity/gradle-version.log
          grep -Fxq 'Gradle 9.9.1' qualified-identity/gradle-version.log
          (cd qualified-identity && sha256sum SOURCE_INPUTS.json SOURCE_RECEIPT.tsv java-version.log gradle-version.log > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Execute all nine original included-build identity TestKit methods
        shell: bash
        run: |
          set -euo pipefail
          (cd qualified-identity && sha256sum -c SHA256SUMS)
          cd consumer-gradle-identity
          ./gradlew --no-daemon --stacktrace --console=plain \
            -p m3/quality-bridge test \
            --tests 'io.synexia.gradle.quality.M3IdeDeltaExportTaskTest' \
            --tests 'io.synexia.gradle.quality.M3IdeDeltaReviewTaskTest' \
            --tests 'io.synexia.gradle.quality.M3QualityPluginTest' \
            --rerun-tasks 2>&1 | tee "$GITHUB_WORKSPACE/qualified-identity/gradle-test.log"
      - name: Admit only the nine exact non-skipped identity receipts and unchanged sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_RECEIPTS'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import hashlib
          import json
          import subprocess
          root = Path('consumer-gradle-identity')
          directory = root / 'm3/quality-bridge/build/test-results/test'
          pkg = 'io.synexia.gradle.quality.'
          suites = {
              'M3IdeDeltaExportTaskTest': {
                  'emitsFullFallbackAndThenNativeModifiedAndDeletedPathChanges()',
                  'pluginApplicationAndHelpNeverExportOrStartAnyTool()',
                  'refusesForeignSourceBeforePublishingEvenOnTheFirstFullBuild()',
                  'nativeBuildTreeIdentitySurvivesConfigurationCacheReplay()',
                  'reviewRefusesAnotherIncludedBuildEvenWhenItsDigestIsPinned()',
                  'explicitCompositeIdentityOverridesRemainExact()',
              },
              'M3IdeDeltaReviewTaskTest': {
                  'acceptsExactPinnedBytesButNeverGrantsGradleBuildAuthority()',
                  'failsOnCorruptBytesAndForeignOwnerEvenWhenHashMatches()',
              },
              'M3QualityPluginTest': {
                  'registersLazyTasksWithoutDownloadingToolsOrApplyingRewrite()',
              },
          }
          expected = {'TEST-' + pkg + name + '.xml' for name in suites}
          assert {p.name for p in directory.glob('TEST-*.xml')} == expected
          for suite, wanted in suites.items():
              p = directory / ('TEST-' + pkg + suite + '.xml')
              assert p.is_file() and not p.is_symlink() and p.stat().st_size < 1024*1024
              for parent in p.parents:
                  assert not parent.is_symlink()
              raw = p.read_bytes()
              text = raw.decode('utf-8')
              assert '\x00' not in text and '<!DOCTYPE' not in text and '<!ENTITY' not in text
              node = ET.fromstring(text)
              assert node.tag == 'testsuite' and node.get('name') == pkg + suite
              assert all(node.get(k) == str(v) for k, v in (
                  ('tests', len(wanted)), ('skipped', 0), ('failures', 0), ('errors', 0)))
              cases = [c for c in node if c.tag == 'testcase']
              assert len(cases) == len(wanted) and {c.get('name') for c in cases} == wanted
              assert all(c.get('classname') == pkg + suite and not list(c) for c in cases)
          receipt = json.loads(Path('qualified-identity/SOURCE_INPUTS.json').read_text())
          assert receipt['ref'] == '507d1830b61bb6afaaf80268f0f6e815d7c9ee01'
          assert receipt['module_tree'] == '36a98dcba8578d34a418739afcbae53ab5de3e0f'
          for row in receipt['files']:
              p = root / row['path']
              assert p.is_file() and not p.is_symlink()
              for parent in p.parents:
                  assert not parent.is_symlink()
              assert len(p.read_bytes()) == row['bytes']
              assert hashlib.sha256(p.read_bytes()).hexdigest() == row['sha256'], row['path']
              assert bool(p.stat().st_mode & 0o111) == (row['mode'] == '100755'), row['path']
          assert {p.relative_to(root).as_posix()
                  for p in (root / 'm3/quality-bridge/src').rglob('*.java')} == {
                      row['path'] for row in receipt['files'] if row['path'].endswith('.java')}
          scopes = ['gradlew', 'gradle/wrapper', 'm3/quality-bridge/build.gradle.kts',
                    'm3/quality-bridge/settings.gradle.kts', 'm3/quality-bridge/src']
          assert not subprocess.check_output(
              ['git', '-C', str(root), 'ls-files', '--others', '--exclude-standard', '--', *scopes]).strip()
          assert not subprocess.check_output(
              ['git', '-C', str(root), 'ls-files', '--others', '--ignored', '--exclude-standard',
               '--', 'm3/quality-bridge/src']).strip()
          head = subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD']).decode().strip()
          assert head == receipt['ref']
          subprocess.run(['git', '-C', str(root), 'diff', '--exit-code', '--quiet', 'HEAD'], check=True)
          print('PASS: nine original Gradle 78 identity methods; zero failures/errors/skips; sources unchanged')
          PY_RECEIPTS
          (cd qualified-identity && sha256sum -c SHA256SUMS)
          test -s consumer-gradle-identity/m3/quality-bridge/build/classes/java/main/io/synexia/gradle/quality/M3QualityPlugin.class
          test -s consumer-gradle-identity/m3/quality-bridge/build/pluginUnderTestMetadata/plugin-under-test-metadata.properties
          (cd consumer-gradle-identity/m3/quality-bridge && \
            find build/classes/java/main build/resources/main build/pluginUnderTestMetadata -type f -print0 | \
            LC_ALL=C sort -z | xargs -0 sha256sum) > qualified-identity/RUNTIME_SHA256SUMS
          (cd consumer-gradle-identity/m3/quality-bridge && \
            sha256sum -c "$GITHUB_WORKSPACE/qualified-identity/RUNTIME_SHA256SUMS")
      - name: Retain original identity XML, runtime classes and source/toolchain receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-gradle78-identity-jdk-${{ matrix.java }}
          path: |
            qualified-identity/
            consumer-gradle-identity/m3/quality-bridge/build/test-results/test/**
            consumer-gradle-identity/m3/quality-bridge/build/reports/tests/test/**
            consumer-gradle-identity/m3/quality-bridge/build/classes/java/main/**
            consumer-gradle-identity/m3/quality-bridge/build/resources/main/**
            consumer-gradle-identity/m3/quality-bridge/build/pluginUnderTestMetadata/**
          if-no-files-found: warn
          retention-days: 14

  gradle-javac-provider-reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Guard the additive compiler reuse lane and retain the original acceptance jobs
        shell: bash
        run: sh tools/project-db/scripts/verify-gradle-maven274-fused-cache.sh --provider
      - name: Checkout the exact original Maven compiler and cache owner
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/maven
          ref: 53d7bd782077968e596a54cb7948ea22810734c3
          path: source-maven-provider
          persist-credentials: false
      - name: Seal the original Maven engine module raw source bytes and modes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualified-provider
          test ! -e source-maven-provider/tools/m3-polyglot-maven-plugin/target
          python3 - <<'PY_MAVEN_SOURCE_CAPTURE'
          from pathlib import Path, PurePosixPath
          import hashlib
          import json
          import subprocess
          root = Path('source-maven-provider')
          assert root.is_dir() and not root.is_symlink()
          ref = '53d7bd782077968e596a54cb7948ea22810734c3'
          module_path = 'tools/m3-polyglot-maven-plugin'
          module_tree = '3652731870e840170acca60acfeea298cc9c85fd'
          def git(*args):
              return subprocess.check_output(['git', '-C', str(root), *args])
          assert git('rev-parse', 'HEAD').decode().strip() == ref
          assert git('rev-parse', 'HEAD:' + module_path).decode().strip() == module_tree
          rows = []
          for record in filter(None, git('ls-tree', '-rz', 'HEAD', '--', module_path).split(b'\0')):
              header, encoded_path = record.split(b'\t', 1)
              mode, kind, expected_blob = header.decode().split()
              path = encoded_path.decode('utf-8')
              relative = PurePosixPath(path)
              assert not relative.is_absolute() and '..' not in relative.parts
              assert relative.as_posix() == path and path.startswith(module_path + '/')
              assert kind == 'blob' and mode in ('100644', '100755')
              assert not path.startswith(module_path + '/target/')
              source = root
              for part in relative.parts:
                  source = source / part
                  assert not source.is_symlink()
              assert source.is_file()
              raw = source.read_bytes()
              actual_blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              assert actual_blob == expected_blob, path
              assert bool(source.stat().st_mode & 0o111) == (mode == '100755'), path
              rows.append({'path': path, 'mode': mode, 'git_blob': expected_blob,
                           'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()})
          assert rows and len({row['path'] for row in rows}) == len(rows)
          import os
          target = root / module_path / 'target'
          assert not target.is_symlink()
          assert not target.exists() or target.is_dir()
          assert not git('ls-files', '--stage', '-z', '--', module_path + '/target')
          actual_paths = set()
          for directory, directories, files in os.walk(root / module_path, followlinks=False):
              parent = Path(directory)
              for name in list(directories):
                  child = parent / name
                  assert not child.is_symlink()
                  if child == target:
                      directories.remove(name)
              for name in files:
                  child = parent / name
                  assert child.is_file() and not child.is_symlink()
                  actual_paths.add(child.relative_to(root).as_posix())
          assert actual_paths == {row['path'] for row in rows}
          assert not git('ls-files', '--others', '--exclude-standard', '-z', '--', module_path)
          ignored = [path.decode('utf-8') for path in
                     git('ls-files', '--others', '--ignored', '--exclude-standard', '-z',
                         '--', module_path).split(b'\0') if path]
          assert all(path.startswith(module_path + '/target/') for path in ignored), ignored
          current = {'schema': 'M3_MAVEN_PROVIDER_SOURCE_INPUTS_V1', 'ref': ref,
                     'module_path': module_path, 'module_tree': module_tree, 'files': rows}
          receipt = Path('qualified-provider/MAVEN_SOURCE_INPUTS.json')
          assert not receipt.exists() and not receipt.is_symlink()
          receipt.write_text(json.dumps(current, indent=2) + '\n', encoding='utf-8')
          print('PASS: exact raw Maven engine module inputs:', len(rows))
          PY_MAVEN_SOURCE_CAPTURE
          (cd qualified-provider && sha256sum MAVEN_SOURCE_INPUTS.json > MAVEN_SOURCE_SHA256SUMS && sha256sum -c MAVEN_SOURCE_SHA256SUMS)
      - name: Verify the original Maven engine and retain its actual source-built JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualified-provider
          test "$(git -C source-maven-provider rev-parse HEAD)" = 53d7bd782077968e596a54cb7948ea22810734c3
          mvn -B -ntp -f source-maven-provider/tools/m3-polyglot-maven-plugin/pom.xml verify \
            2>&1 | tee qualified-provider/maven-verify.log
          grep -Fq 'build-cache/module-state integration checks' qualified-provider/maven-verify.log
          test -s source-maven-provider/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar
          jar tf source-maven-provider/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar |
            grep -Fx 'io/synexia/maven/polyglot/TaskRunner.class'
          cp source-maven-provider/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar qualified-provider/polyglot.jar
          (cd qualified-provider && sha256sum -c MAVEN_SOURCE_SHA256SUMS)
          python3 - <<'PY_MAVEN_SOURCE_CHECK'
          from pathlib import Path, PurePosixPath
          import hashlib
          import json
          import subprocess
          root = Path('source-maven-provider')
          assert root.is_dir() and not root.is_symlink()
          ref = '53d7bd782077968e596a54cb7948ea22810734c3'
          module_path = 'tools/m3-polyglot-maven-plugin'
          module_tree = '3652731870e840170acca60acfeea298cc9c85fd'
          def git(*args):
              return subprocess.check_output(['git', '-C', str(root), *args])
          assert git('rev-parse', 'HEAD').decode().strip() == ref
          assert git('rev-parse', 'HEAD:' + module_path).decode().strip() == module_tree
          rows = []
          for record in filter(None, git('ls-tree', '-rz', 'HEAD', '--', module_path).split(b'\0')):
              header, encoded_path = record.split(b'\t', 1)
              mode, kind, expected_blob = header.decode().split()
              path = encoded_path.decode('utf-8')
              relative = PurePosixPath(path)
