# SPDX-License-Identifier: Apache-2.0
name: One-shot Maven Compiler Facts Spotless Repair

on:
  push:
    branches:
      - codex/apache-maven4-m3-merge-20261025
    paths:
      - .github/workflows/m3-maven-spotless-repair-20261026.yml

permissions:
  contents: write

jobs:
  format-two-files:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/apache-maven4-m3-merge-20261025
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Format original compiler-facts owners only
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -pl impl/maven-impl spotless:apply -DskipTests
          git diff --check
          git diff --name-only > /tmp/m3-spotless-changed.txt
          if grep -vE '^impl/maven-impl/src/(main|test)/java/org/apache/maven/impl/DefaultCompilerFactsService(Test)?\.java$' /tmp/m3-spotless-changed.txt | grep -q .; then
            echo 'Formatter modified unrelated source paths; refusing to promote.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- impl/maven-impl/src/main/java/org/apache/maven/impl/DefaultCompilerFactsService.java
          git add -- impl/maven-impl/src/test/java/org/apache/maven/impl/DefaultCompilerFactsServiceTest.java
          git rm -- .github/workflows/m3-maven-spotless-repair-20261026.yml
          git diff --cached --quiet || git commit -m 'style(maven): apply original Spotless on compiler-facts files'
          git push origin HEAD:refs/heads/codex/apache-maven4-m3-merge-20261025
