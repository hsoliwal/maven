---
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.maven.recipes.Jdk21Baseline
displayName: JDK 21 build baseline
description: >-
  Raises GitHub Actions `actions/setup-java` `java-version` values below 21 (scalars and the matrix lists, include
  and exclude entries they refer to) to 21, marks the ones below 21 it cannot raise, and marks the Maven POM Java
  levels above 21, which a JDK 21 build cannot compile.
recipeList:
  - org.apache.maven.recipes.SetupJavaMinimumVersion:
      minimumJavaMajorVersion: 21
  - org.apache.maven.recipes.FindSetupJavaVersionBelowMinimum:
      minimumJavaMajorVersion: 21
  - org.apache.maven.recipes.FindJavaLevelAboveMaximum:
      maximumJavaMajorVersion: 21
