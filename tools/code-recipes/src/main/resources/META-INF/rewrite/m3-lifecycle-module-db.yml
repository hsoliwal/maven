---
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.maven.recipes.EnableM3LifecycleModuleDb
displayName: Opt into verified per-module M3DB native Maven lifecycle reuse
description: >-
  Adds the explicit native Maven lifecycle properties for a content-verified
  per-module M3DB success receipt (.m3/module.m3db). Existing user values are
  preserved: an explicit false or a different supported storage backend is
  never overwritten. This recipe changes only POM configuration; it does not
  execute goals, trust timestamps, install a watcher, or authorize arbitrary
  plugin reuse. Activate it deliberately through OpenRewrite.
recipeList:
  - org.apache.maven.recipes.M3LifecycleModuleDbDefaults
