# Explicitly selected OpenRewrite migration; never activates on ordinary Maven invocations.
# Carried from maven #144 (decision 55: its own M3ModuleDb format is retired) and re-targeted
# from the m3.polyglot.m3db switch, which never existed on master, to the owner-backed default
# state backend m3.polyglot.incrementalState=embedded (jdk.m3.indexdb.M3IndexDB, .m3/module.m3db).
# trustParent is not set: with trustParent=true, AddProperty changes nothing unless a parent
# POM already defines the key (verified with rewrite-maven-plugin 6.46.1 dryRun).
type: specs.openrewrite.org/v1beta/recipe
name: io.synexia.maven.recipe.EnableM3ModuleDb
displayName: Enable opt-in per-module M3DB reuse for polyglot tasks
description: >-
  Adds the two opt-in properties for module-local, content-verified polyglot task
  receipts stored through the M3JDK owner jdk.m3.indexdb.M3IndexDB
  (.m3/module.m3db). No arbitrary Maven Mojo, CodeQL, OpenRewrite or M3
  compiler/atomizer/patternizer provider becomes cacheable. Existing explicit
  property values remain authoritative and must be checked by the operator.
recipeList:
  - org.openrewrite.maven.AddProperty:
      key: m3.polyglot.incremental
      value: 'true'
      preserveExistingValue: true
  - org.openrewrite.maven.AddProperty:
      key: m3.polyglot.incrementalState
      value: embedded
      preserveExistingValue: true
