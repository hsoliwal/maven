# Copy to the TARGET Git repository as .m3/patch-boot.properties.
# Intentionally invalid placeholders; bootstrap must refuse until reviewed.
repository=OWNER/REPOSITORY
pr=PR_NUMBER
base=PINNED_40_CHARACTER_LOCAL_BASE_GIT_SHA
head=PINNED_40_CHARACTER_GITHUB_PR_HEAD_GIT_SHA
patchSha256=PINNED_64_CHARACTER_EXACT_PATCH_SHA256
# No GitHub request on regular builds unless true or explicit CLI flag.
autoCheck=false
