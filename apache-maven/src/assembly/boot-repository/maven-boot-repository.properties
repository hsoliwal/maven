#
# Boot repository of the inline plugins (distribution built with -Pplugins).
#
# ${maven.home}/repository holds the default-lifecycle plugins built from plugins/ and the artifacts their
# runs load. It is chained read-only after the user's local repository, so a fresh build needs no plugin
# download for the default lifecycle. A user or project maven.repo.local.tail replaces this value: append
# ${maven.home}/repository to it to keep the boot repository.
#
maven.repo.local.tail = ${maven.home}/repository
maven.repo.local.tail.ignoreAvailability = true
